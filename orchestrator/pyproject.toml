[project]
name = "bulwark-cloud-orchestrator"
version = "0.1.0"
description = "ECS task orchestrator — Python wrapper around the bulwark CLI"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "python-ulid>=2.2",
    "bulwark-cloud-shared",
]

[tool.uv]
package = true

[tool.uv.sources]
bulwark-cloud-shared = { workspace = true }
