[project]
name = "bulwark-cloud-api"
version = "0.1.0"
description = "FastAPI Lambda handler for the bulwark-cloud public API"
requires-python = ">=3.12"

[project.dependencies]
fastapi = ">=0.111"
mangum = ">=0.17"
pydantic = ">=2.7"
pydantic-settings = ">=2.2"
boto3 = ">=1.34"
python-ulid = ">=2.2"
bulwark-cloud-shared = { path = "../shared" }

[tool.uv]
package = true

[tool.uv.sources]
bulwark-cloud-shared = { path = "../shared", editable = true }
