[project]
name = "bulwark-cloud-shared"
version = "0.1.0"
description = "Shared Pydantic models for bulwark-cloud"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["setuptools>=40"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
package = true
