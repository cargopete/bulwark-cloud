name: Deploy to dev

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-north-1
  IMAGE_TAG: v0.1.0

jobs:
  deploy:
    name: CDK deploy (dev)
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Deploy Network + Storage + Compute first so the ECR repo exists
      # before we try to push the worker image to it.
      - name: CDK deploy — Network, Storage, Compute
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          uv sync
          cdk deploy BulwarkCloudNetwork BulwarkCloudStorage BulwarkCloudCompute \
            --require-approval never

      - name: Build + push worker image
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          ECR_REPO: bulwark-cloud
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin $ECR_REGISTRY

          # Build the bulwark CLI base image from source (no Docker Hub dep)
          git clone --depth=1 https://github.com/cargopete/bulwark.git /tmp/bulwark
          docker build -t cargopete/bulwark-cli:${{ env.IMAGE_TAG }} /tmp/bulwark

          # Build the orchestrator wrapper on top
          docker build \
            --build-arg BASE_IMAGE=cargopete/bulwark-cli:${{ env.IMAGE_TAG }} \
            -t $ECR_REGISTRY/$ECR_REPO:${{ env.IMAGE_TAG }} \
            orchestrator/

          docker push $ECR_REGISTRY/$ECR_REPO:${{ env.IMAGE_TAG }}

      # Deploy remaining stacks (Orchestration, Api, Observability).
      # The ECS task definition now points at the image we just pushed.
      - name: CDK deploy — all remaining stacks
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: cdk deploy --all --require-approval never
