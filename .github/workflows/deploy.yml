name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run tests
        run: uv run pytest --tb=short -q

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: test
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
      ECR_REPO: bulwark-cloud-orchestrator

    steps:
      - uses: actions/checkout@v4

      # Bulwark CLI source — needed to build the base Docker image
      - name: Checkout bulwark CLI
        uses: actions/checkout@v4
        with:
          repository: cargopete/bulwark
          path: _bulwark

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install Python deps
        run: uv sync --all-packages

      # ── CDK bootstrap (idempotent — safe to run every deploy) ────────────
      - name: CDK bootstrap
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          cd infra
          uv run cdk bootstrap \
            "aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}" \
            --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess \
            --trust "${{ secrets.AWS_DEPLOY_ROLE_ARN }}"

      # ── Deploy Network + Storage + Compute first so ECR repo exists ───────
      - name: CDK deploy — Network, Storage, Compute
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          cd infra
          uv run cdk deploy BulwarkCloudNetwork BulwarkCloudStorage BulwarkCloudCompute \
            --require-approval never

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Docker: build base image then orchestrator ────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build bulwark base image
        uses: docker/build-push-action@v5
        with:
          context: _bulwark
          push: false
          load: true
          tags: bulwark-base:ci
          cache-from: type=gha,scope=bulwark-base
          cache-to: type=gha,mode=max,scope=bulwark-base

      - name: Build and push orchestrator image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${REGISTRY}/${ECR_REPO}:${IMAGE_TAG}"

          docker build \
            --build-arg BASE_IMAGE=bulwark-base:ci \
            -f orchestrator/Dockerfile \
            -t "$IMAGE_URI" \
            -t "${REGISTRY}/${ECR_REPO}:latest" \
            .

          docker push "$IMAGE_URI"
          docker push "${REGISTRY}/${ECR_REPO}:latest"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      # ── CDK deploy remaining stacks ───────────────────────────────────────
      - name: CDK deploy — remaining stacks
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          cd infra
          uv run cdk deploy --all \
            --require-approval never \
            --context orchestratorImageTag="$IMAGE_TAG"
